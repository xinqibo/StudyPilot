services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: studypilot-api:latest
    container_name: studypilot-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/study_pilot.db
    volumes:
      - study_pilot_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  study_pilot_data:
